# Push a tag like v0.2.0 to publish a GitHub release with a ready-to-install wheel
# (users then need neither Node.js nor a build step).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          set -eux
          python -m pip install -U "jupyterlab>=4.3,<5" build
          jlpm install
          python -m build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
